# ===================================================================
# 智慧網管大數據平台 - InfluxDB V2 企業級設定檔
# 硬體規格: 8 Core CPU / 24GB RAM
# 作業系統: Windows 10 LTSC
# ===================================================================

# 🌟 1. 大數據儲存引擎路徑 (請替換為您實際搬移過去的 D 槽路徑)
# 注意：Windows 路徑必須使用雙反斜線 \\ 或 單正斜線 /
engine-path = "D:\\InfluxDB_Data\\engine"
bolt-path = "D:\\InfluxDB_Data\\influxd.bolt"

# 🌟 2. 寫入日誌同步延遲 (拯救硬碟 I/O，大幅降低系統卡死機率)
storage-wal-fsync-delay = "50ms"

# 🌟 3. 記憶體快照緩存大小 (善用 24GB 大記憶體，湊滿 100MB 才寫入硬碟)
storage-cache-snapshot-memory-size = 104857600

# 🌟 4. 限制並發查詢數 (保護 8 核心 CPU，防止惡意巨量查詢癱瘓系統)
query-concurrency = 20

# 🌟 將記憶體快取上限從預設的 1GB 提升到 2GB (如果伺服器 RAM 夠大，可以改為 4294967296 也就是 4GB)
storage-cache-max-memory-size = 2147483648

# 🌟 提升寫入併發能力，加速消化海量流量
storage-wal-max-concurrent-writes = 5

# (可選) 您也可以在這裡指定資料庫的儲存路徑，例如移到 D 槽提升效能
# engine-path = "D:\\InfluxDB\\engine"
# bolt-path = "D:\\InfluxDB\\influxd.bolt"

