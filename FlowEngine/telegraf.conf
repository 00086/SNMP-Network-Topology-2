# ==================================================
# ⚙️ Telegraf 全域設定
# ==================================================
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 50000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "5s"
  omit_hostname = false
  log_with_timezone = "local"
  debug = false
  quiet = false
  logfile = ""

# ==================================================
# 📤 輸出設定：將資料送到 InfluxDB v2
# ==================================================
[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  
  # 🔴 請將下方的 Token 替換成您剛剛在網頁複製的那一長串鑰匙
  token = "KLZQksXn_0WmjO0awXYcTMtVhkGiXVmz3tGOZ1tyqJwPVx0nAOfqXO9j2qOmwDhNntBHZynLxY0ot7aJv8fqWQ=="
  
  # 🔴 請將下方替換成您的 Organization 名稱 (例如 SNMP_NMS)
  organization = "SNMP_Topology"
  
  bucket = "flow_data"
  
  # 🌟 加上這行，將預設的 5s 等候時間延長到 15s 或 20s
  timeout = "15s"

# ==================================================
# 📥 輸入設定：開啟 UDP 接收 Switch 丟來的封包
# ==================================================
# 接收 NetFlow v5 / v9 / IPFIX (Cisco, H3C, Juniper 常見)
[[inputs.netflow]]
  service_address = "udp://:2055"

# 接收 sFlow (Aruba, HP, EdgeCore, Ruckus 常見)
[[inputs.sflow]]
  service_address = "udp://:6343"