<script>
let portManageModalInstance = null; 

function openPortManageModal(ip, portIdx, portName, liveIpsStr) {
    document.getElementById('pm_ip').value = ip;
    document.getElementById('pm_portIdx').value = portIdx;
    document.getElementById('pm_portName').value = portName;
    document.getElementById('portManageTitle').innerHTML = `<i class="bi bi-gear-fill me-2"></i>標註網孔設定 - ${portName} <span class="text-white-50 ms-2" style="font-size: 0.85rem;">(${ip})</span>`;
    
    let liveItems = [];
    if (liveIpsStr) {
        liveIpsStr.split(',').forEach(pair => {
            if(pair.trim()) {
                let parts = pair.split('|');
                liveItems.push({ ip: parts[0] || '', mac: parts[1] || '' });
            }
        });
    }

    fetch(`/api/device/port/manage?ip=${ip}&port_idx=${portIdx}`)
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            // 💡 恢復 Uplink 與 MGMT 開關讀取
            document.getElementById('pm_isUplink').checked = res.is_manual_uplink || false;
            document.getElementById('pm_isMgmt').checked = res.is_manual_mgmt || false; // 🌟 讀取 MGMT

            let savedItems = [];
            if (res.memorized_ips) {
                res.memorized_ips.split(',').forEach(pair => {
                    if(pair.trim()) {
                        let parts = pair.split('|');
                        savedItems.push({ ip: parts[0] || '', mac: parts[1] || '', isSaved: true });
                    }
                });
            }

            let allItemsMap = {};
            savedItems.forEach(item => { allItemsMap[item.ip] = { mac: item.mac, checked: true, isHistory: true }; });
            
            // 🌟 核心修正：將「實時資料 (liveItems)」與「歷史資料」完美整合
            liveItems.forEach(item => { 
                if (!allItemsMap[item.ip]) { 
                    // 如果是完全新的設備，直接加入
                    allItemsMap[item.ip] = { mac: item.mac, checked: false, isHistory: false }; 
                } else {
                    // 🌟 如果歷史記憶裡寫著「未知 MAC」，但實時資料 (包含我們剛 Ping 完覆寫傳進來的) 卻有真正的 MAC，
                    // 則強制用真實 MAC 覆蓋掉資料庫裡的未知 MAC，確保畫面永遠呈現最正確的資料！
                    if ((allItemsMap[item.ip].mac === '未知 MAC' || !allItemsMap[item.ip].mac) && item.mac && item.mac !== '未知 MAC') {
                        allItemsMap[item.ip].mac = item.mac;
                    }
                }
            });

            let tbody = document.getElementById('pm_ipListBody');
            tbody.innerHTML = '';
            
            let keys = Object.keys(allItemsMap);
            if(keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-white-50 py-4">此網孔目前尚無歷史記憶或實時連線設備。</td></tr>`;
            } else {
                keys.forEach((k, idx) => {
                    let obj = allItemsMap[k];
                    let chkId = `pm_chk_${idx}`;
                    let historyBadge = obj.isHistory ? `<span class="badge bg-secondary ms-2" style="font-size: 0.7rem;">歷史記憶</span>` : '';
                    
                    // 🌟 核心升級：加入 d-flex 完美排版，並補上紅色垃圾桶與黃色 Ping 按鈕
                    let safeIpForId = k.replace(/\./g, '_');
                    tbody.innerHTML += `
                        <tr>
                            <td class="text-info fw-bold ps-2 align-middle">${k} ${historyBadge}</td>
                            <td class="text-white-50 font-monospace align-middle" id="mac_display_${safeIpForId}">${obj.mac}</td>
                            <td class="text-center align-middle">
                                <div class="d-flex justify-content-center align-items-center gap-2 m-0">
                                    <div class="form-check form-switch m-0" title="記憶開關">
                                        <input class="form-check-input pm-ip-checkbox" type="checkbox" id="${chkId}" data-ip="${k}" data-mac="${obj.mac}" ${obj.checked ? 'checked' : ''} onchange="checkMaxLimits(this)" style="cursor:pointer; transform: scale(1.2);">
                                    </div>
                                    <button type="button" class="btn btn-sm btn-outline-warning py-0 px-2 shadow-sm" onclick="fetchMacWithPing(this, '${k}', '${chkId}')" title="用本機伺服器取得 ARP MAC">
                                        <i class="bi bi-activity"></i> Ping
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2 shadow-sm" onclick="this.closest('tr').remove()" title="將此 IP 從記憶清單中移除">
                                        <i class="bi bi-trash-fill"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            }
            
            let modalEl = document.getElementById('portManageModal');
            if (!portManageModalInstance) portManageModalInstance = new bootstrap.Modal(modalEl);
            portManageModalInstance.show();
        } else {
            if(typeof window.showToast === 'function') window.showToast(res.message || "無法讀取網孔歷史設定", "danger");
        }
    })
    .catch(err => {
        console.error("API 錯誤:", err);
    });
}

function checkMaxLimits(checkbox) {
    let checkedBoxes = document.querySelectorAll('.pm-ip-checkbox:checked');
    if (checkedBoxes.length > 6) {
        if(typeof window.showToast === 'function') window.showToast("⚠️ 一個網孔最多只能記憶 6 組終端設備！", "warning");
        checkbox.checked = false;
    }
}

// 🌟 透過本機伺服器 Ping 並取得 ARP 的 MAC 位址
function fetchMacWithPing(btn, ip, chkId) {
    let originalHtml = btn.innerHTML;
    // 點擊後按鈕變成轉圈圈讀取狀態
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
    btn.classList.add('disabled');
    
    fetch(`/api/ping_mac/${ip}`)
    .then(r => r.json())
    .then(res => {
        if (res.success && res.mac) {
            let safeIp = ip.replace(/\./g, '_');
            // 1. 將畫面上顯示的「未知 MAC」抽換成真實 MAC
            document.getElementById(`mac_display_${safeIp}`).innerText = res.mac;
            // 2. 將 MAC 寫入 checkbox 屬性，確保「儲存設定」時能正確寫入資料庫
            document.getElementById(chkId).setAttribute('data-mac', res.mac);
            if(typeof window.showToast === 'function') window.showToast(`✅ 成功取得實體 MAC: ${res.mac}`, "success");
        } else {
            if(typeof window.showToast === 'function') window.showToast(`❌ ${res.message}`, "warning");
        }
    })
    .catch(err => {
        if(typeof window.showToast === 'function') window.showToast(`❌ 網路錯誤，無法與伺服器連線`, "danger");
    })
    .finally(() => {
        // 恢復按鈕原本的樣貌
        btn.innerHTML = originalHtml;
        btn.classList.remove('disabled');
    });
}

// ➕ 手動新增 IP 與 MAC 至清單 (含智慧格式校正)
function addManualIpMac() {
    let ipInput = document.getElementById('pm_manual_ip');
    let macInput = document.getElementById('pm_manual_mac');
    let ip = ipInput.value.trim();
    let macRaw = macInput.value.trim();
    let mac = '未知 MAC (手動)';

    // 🌟 智慧 MAC 校正引擎：容忍 "-" 並自動轉為標準 ":" 格式
    if (macRaw) {
        // 1. 先全部轉大寫，並把 Windows 習慣的 "-" 統一轉成 ":"
        mac = macRaw.toUpperCase().replace(/-/g, ':');
        
        // 2. 如果管理員很懶，直接複製貼上連續 12 碼 (如 E454E863A600)，自動幫他切分補上 ":"
        let cleanMac = mac.replace(/[^0-9A-F]/g, '');
        if (cleanMac.length === 12) {
            mac = cleanMac.match(/.{1,2}/g).join(':');
        }
    }

    if (!ip) {
        if(typeof window.showToast === 'function') window.showToast("⚠️ 請輸入要綁定的 IP 位址！", "warning");
        return;
    }

    // 基礎 IPv4 格式驗證
    if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(ip)) {
        if(typeof window.showToast === 'function') window.showToast("⚠️ IP 格式不正確！", "danger");
        return;
    }

    // 檢查是否已達 6 組上限
    let checkedBoxes = document.querySelectorAll('.pm-ip-checkbox:checked');
    if (checkedBoxes.length >= 6) {
        if(typeof window.showToast === 'function') window.showToast("⚠️ 警告：一個網孔最多只能記憶 6 組終端設備！", "warning");
        return;
    }

    // 檢查表格中是否已經有這個 IP，避免重複加入
    let exists = false;
    document.querySelectorAll('.pm-ip-checkbox').forEach(chk => {
        if (chk.getAttribute('data-ip') === ip) exists = true;
    });
    
    if (exists) {
        if(typeof window.showToast === 'function') window.showToast("⚠️ 此 IP 已經在下方清單中了！", "warning");
        return;
    }

    let chkId = `pm_chk_manual_${Date.now()}`;
    
    let safeIpForId = ip.replace(/\./g, '_');
    // 建立新的一列 (自帶「手動加入」藍色標籤、開啟狀態、Ping 取號以及垃圾桶按鈕)
    let newRow = `
        <tr class="table-primary" style="--bs-table-bg: rgba(13, 110, 253, 0.1);">
            <td class="text-info fw-bold ps-2 align-middle">${ip} <span class="badge bg-primary ms-2" style="font-size: 0.7rem;">手動加入</span></td>
            <td class="text-white-50 font-monospace align-middle" id="mac_display_${safeIpForId}">${mac}</td>
            <td class="text-center align-middle">
                <div class="d-flex justify-content-center align-items-center gap-2 m-0">
                    <div class="form-check form-switch m-0" title="記憶開關">
                        <input class="form-check-input pm-ip-checkbox" type="checkbox" id="${chkId}" data-ip="${ip}" data-mac="${mac}" checked onchange="checkMaxLimits(this)" style="cursor:pointer; transform: scale(1.2);">
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-warning py-0 px-2 shadow-sm" onclick="fetchMacWithPing(this, '${ip}', '${chkId}')" title="用本機伺服器取得 ARP MAC">
                        <i class="bi bi-activity"></i> Ping
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2 shadow-sm" onclick="this.closest('tr').remove()" title="將此 IP 從記憶清單中移除">
                        <i class="bi bi-trash-fill"></i>
                    </button>
                </div>
            </td>
        </tr>
    `;

    let tbody = document.getElementById('pm_ipListBody');
    
    // 如果原本顯示「此網孔目前尚無歷史記憶」，先把它清空
    if (tbody.innerHTML.includes("此網孔目前尚無歷史記憶")) {
        tbody.innerHTML = '';
    }
    
    // 將新資料插在表格的最上方
    tbody.insertAdjacentHTML('afterbegin', newRow);
    
    // 清空輸入框方便下次輸入
    ipInput.value = '';
    macInput.value = '';
    
    if(typeof window.showToast === 'function') window.showToast("✅ 已手動加入清單，請記得點擊右下角「儲存設定」！", "success");
}

function savePortAnnotation() {
    let btn = document.getElementById('btn-pm-save');
    let oriHtml = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>儲存中...';
    btn.disabled = true;

    let ip = document.getElementById('pm_ip').value;
    let portIdx = document.getElementById('pm_portIdx').value;
    let portName = document.getElementById('pm_portName').value;
    let isUplink = document.getElementById('pm_isUplink').checked; 
    let isMgmt = document.getElementById('pm_isMgmt').checked; // 🌟 抓取 MGMT 狀態
    
    let checkedBoxes = document.querySelectorAll('.pm-ip-checkbox:checked');
    let ipsArr = [];
    checkedBoxes.forEach(chk => { ipsArr.push(`${chk.getAttribute('data-ip')}|${chk.getAttribute('data-mac')}`); });
    let ipsStr = ipsArr.join(',');

    fetch('/api/device/port/manage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // 🌟 把 is_mgmt 塞進 payload 送給後端
        body: JSON.stringify({ action: 'save', ip: ip, port_idx: portIdx, port_name: portName, is_uplink: isUplink, is_mgmt: isMgmt, ips: ipsStr }) 
    })
    .then(r => r.json())
    .then(res => {
        btn.innerHTML = oriHtml; btn.disabled = false;
        if (res.success) {
            if(typeof window.showToast === 'function') window.showToast(res.message, "success");
            if(portManageModalInstance) portManageModalInstance.hide();
            
            // 🌟 終極殺招：因為 loadPortSettingsCache 是非同步的，我們必須「等」它把最新鮮的資料庫抓完，
            // 再執行重繪 (updateRightClickModalContent)，否則重繪時會吃到舊快取，導致剛存好的 MAC 消失！
            if(typeof window.loadPortSettingsCache === 'function') {
                Promise.resolve(window.loadPortSettingsCache()).then(() => {
                    if(typeof window.updateRightClickModalContent === 'function') window.updateRightClickModalContent(ip);
                    if(typeof updateNodeVisibility === 'function') updateNodeVisibility(); // 立即套用新的收合規則
                });
            } else {
                if(typeof window.updateRightClickModalContent === 'function') window.updateRightClickModalContent(ip);
                if(typeof updateNodeVisibility === 'function') updateNodeVisibility();
            }
        } else {
            if(typeof window.showToast === 'function') window.showToast(res.message, "danger");
        }
    })
    .catch(err => {
        btn.innerHTML = oriHtml; btn.disabled = false;
        if(typeof window.showToast === 'function') window.showToast("網路連線異常，儲存失敗！", "danger");
    });
}

function clearPortAnnotation() {
    if(!confirm("⚠️ 確定要清除這個網孔的所有註記 (包含 IP 記憶與 Uplink) 嗎？\n此動作無法復原！")) return;
    
    let btn = document.getElementById('btn-pm-clear');
    let oriHtml = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>清除中...';
    btn.disabled = true;

    let ip = document.getElementById('pm_ip').value;
    let portIdx = document.getElementById('pm_portIdx').value;
    let portName = document.getElementById('pm_portName').value;

    fetch('/api/device/port/manage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'clear', ip: ip, port_idx: portIdx, port_name: portName })
    })
    .then(r => r.json())
    .then(res => {
        btn.innerHTML = oriHtml; btn.disabled = false;
        if (res.success) {
            if(typeof window.showToast === 'function') window.showToast(res.message, "success");
            if(portManageModalInstance) portManageModalInstance.hide();
            if(typeof window.updateRightClickModalContent === 'function') window.updateRightClickModalContent(ip);
        } else {
            if(typeof window.showToast === 'function') window.showToast(res.message, "danger");
        }
    })
    .catch(err => {
        btn.innerHTML = oriHtml; btn.disabled = false;
        if(typeof window.showToast === 'function') window.showToast("網路連線異常，清除失敗！", "danger");
    });
}

// ==========================================
// 🌟 獨立掃描與原地重畫引擎 (拔除全網掃描)
// ==========================================
function confirmRemoveUplink(deviceIp, portName, peerIp, peerName) {
    let ipModal = bootstrap.Modal.getInstance(document.getElementById('portIpModal'));
    if (ipModal) ipModal.hide();

    let confirmModalEl = document.getElementById('removeUplinkModal');
    if (!confirmModalEl) {
        const modalHtml = `
        <div class="modal fade" id="removeUplinkModal" tabindex="-1" aria-hidden="true" style="z-index: 1080;">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content bg-dark text-white shadow-lg border-danger">
                    <div class="modal-header border-secondary" style="background-color: #2c0b0e;">
                        <h6 class="modal-title text-danger fw-bold"><i class="bi bi-scissors me-2"></i>解除實體對接連線</h6>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4 text-center">
                        <div class="d-flex justify-content-center align-items-center mb-3">
                            <span class="badge bg-secondary fs-6" id="ru_deviceIp"></span>
                            <i class="bi bi-link text-danger mx-3" style="font-size: 2rem;"></i>
                            <span class="badge bg-primary fs-6" id="ru_peerIp"></span>
                        </div>
                        <h6 class="mb-3 lh-base">確定要解除此網孔與 <span class="text-info fw-bold" id="ru_peerName"></span> 的連線嗎？</h6>
                        <div class="text-white-50 small text-start bg-black p-2 rounded border border-secondary">
                            <i class="bi bi-info-circle me-1"></i> <b>系統提示：</b>解除後，雙方交換器的配對紀錄將同步移除。若是 LLDP 自動發現的鏈路，將於下次掃描時自動恢復。
                        </div>
                        <input type="hidden" id="ru_portNameVal">
                    </div>
                    <div class="modal-footer border-secondary justify-content-center" style="background-color: #11151c;">
                        <button type="button" class="btn btn-secondary px-4 fw-bold" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-danger fw-bold px-4" id="btn-confirm-ru" onclick="executeRemoveUplink()"><i class="bi bi-trash-fill me-1"></i>確定解除</button>
                    </div>
                </div>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        confirmModalEl = document.getElementById('removeUplinkModal');
    }

    document.getElementById('ru_deviceIp').innerText = deviceIp;
    document.getElementById('ru_peerIp').innerText = peerIp;
    document.getElementById('ru_peerName').innerText = peerName;
    document.getElementById('ru_portNameVal').value = portName;

    new bootstrap.Modal(confirmModalEl).show();
}

function executeRemoveUplink() {
    let btn = document.getElementById('btn-confirm-ru');
    let oriHtml = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>解除中...';
    btn.disabled = true;

    let ipA = document.getElementById('ru_deviceIp').innerText;
    let portA = document.getElementById('ru_portNameVal').value;
    let ipB = document.getElementById('ru_peerIp').innerText;

    fetch('/api/manual_links/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ip_a: ipA, port_a: portA, ip_b: ipB })
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            bootstrap.Modal.getInstance(document.getElementById('removeUplinkModal')).hide();
            if(typeof window.showToast === 'function') window.showToast(res.message, "success");
            
            // 💡 核心修復：使用 Promise.all 並行執行兩台單機掃描，完全拋棄 fetchSnmpData()
            if(typeof window.showToast === 'function') window.showToast(`🔄 正在重新演算 ${ipA} 與 ${ipB} 的拓樸關聯...`, "info");
            
            Promise.all([
                fetch(`/api/scan_node/${ipA}`, { method: 'POST' }),
                fetch(`/api/scan_node/${ipB}`, { method: 'POST' })
            ])
            .then(() => {
                // 掃描完畢，從後端拉最新 edges
                return fetch('/api/topology/fast?t=' + Date.now()).then(r => r.json());
            })
            .then(fastData => {
                if (!fastData.empty) {
                    cachedTopologyData.edges = fastData.edges;
                    cachedTopologyData.nodes = fastData.nodes;
                    if (typeof renderGraph === 'function') renderGraph(false);
                    
                    // 💡 瞬間原地重繪實體面板！
                    if (typeof window.updateRightClickModalContent === 'function') {
                        window.updateRightClickModalContent(ipA);
                    }
                    if(typeof window.showToast === 'function') window.showToast("✅ 對接狀態已徹底斷開，面板已原地更新！", "success");
                }
            })
            .catch(err => console.error("獨立掃描失敗:", err))
            .finally(() => {
                btn.innerHTML = oriHtml; btn.disabled = false;
            });
            
        } else {
            if(typeof window.showToast === 'function') window.showToast("解除失敗: " + res.message, "danger");
            btn.innerHTML = oriHtml; btn.disabled = false;
        }
    })
    .catch(err => {
        btn.innerHTML = oriHtml; btn.disabled = false;
        if(typeof window.showToast === 'function') window.showToast("網路連線異常", "danger");
    });
}
</script>
